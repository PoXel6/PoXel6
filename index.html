<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoXel6 | Portfolio</title>
    <link rel="stylesheet" href="main.css">

<body>

    <main class="container">

        <section class="contact-links">
            <div class="link-group">
                <a href="https://github.com/poxel6/" target="_blank" aria-label="GitHub Profile">GitHub</a>
                <a href="mailto:iampoxel6@gmail.com" aria-label="Email Address">Email</a>
                <a href="https://github.com/poxel6/poxel6/resume/resume.pdf" target="_blank" aria-label="View Resume PDF">Resume</a>
